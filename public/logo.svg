<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="pdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Water Droplet & Ripple Motif -->
  <g transform="translate(15, 10)">
    <!-- Tank Water Silhouette Ring -->
    <circle cx="40" cy="40" r="36" stroke="url(#pdGrad)" stroke-width="2.5" fill="none" opacity="0.4" />
    <circle cx="40" cy="40" r="32" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 2" fill="none" opacity="0.6" />
    
    <!-- Flowing Betta Tail / Water Wave -->
    <path d="M 22,46 C 28,32 46,28 58,38 C 50,42 42,44 36,54 C 30,64 22,58 22,46 Z" fill="url(#finGrad)" filter="url(#glow)" />
    <path d="M 28,48 C 34,38 48,35 56,42 C 50,47 42,48 38,58 C 34,64 28,58 28,48 Z" fill="#38bdf8" opacity="0.7" />
    
    <!-- Air bubble accents -->
    <circle cx="48" cy="24" r="3.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="56" cy="18" r="2" fill="#7dd3fc" opacity="0.9" />
    <circle cx="42" cy="16" r="1.5" fill="#e0f2fe" opacity="0.7" />
  </g>

  <!-- Typography -->
  <g transform="translate(100, 20)">
    <!-- Monogram Accent -->
    <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="1">
      PD
    </text>
    <text x="56" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="34" fill="#38bdf8" letter-spacing="0.5">
      ACQUA
    </text>
    <text x="194" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="300" font-size="34" fill="#94a3b8" letter-spacing="2">
      WORLD
    </text>

    <!-- Subtitle Tagline -->
    <text x="2" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#38bdf8" letter-spacing="4" opacity="0.85">
      LIVING AQUARIUM SIMULATOR
    </text>
  </g>
</svg>
